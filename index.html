<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta San Marcos — Área C</title>
<style>
  :root{
    --bg:#0d1420; --surface:#141d2c; --raised:#1c2738; --border:#2a3547;
    --fg:#e8edf5; --muted:#8798ad; --primary:#d4a574; --primary-fg:#1a1208;
    --ok:#4fb783; --bad:#e0745f;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  #app{max-width:560px;margin:0 auto;padding:0 0 56px}

  header.top{background:var(--surface);border-bottom:1px solid #2a3547;padding:18px 18px 14px}
  header.top h1{font-family:var(--serif);font-weight:400;font-size:25px;margin:0 0 4px;letter-spacing:-.01em}
  header.top p{margin:0;font-size:12.5px;color:var(--muted)}
  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 18px 0;
      background:var(--surface);border:1px solid #2a3547;border-radius:9px;padding:4px}
  nav button{background:none;border:none;color:var(--muted);font:600 13.5px var(--sans);
             padding:9px 4px;border-radius:6px;cursor:pointer}
  nav button[aria-current="true"]{background:var(--raised);color:var(--fg)}
  main{padding:18px}

  h2{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 8px}
  p.lead{font-size:13.5px;color:var(--muted);margin:0 0 18px}
  .card{background:var(--surface);border:1px solid #2a3547;border-radius:9px}
  .note{background:var(--surface);border:1px solid #2a3547;border-radius:9px;
        padding:14px;font-size:13.5px;color:var(--muted);margin-bottom:20px}
  .note b{color:var(--primary);font-weight:600}

  button.big,button.ghost{width:100%;text-align:left;border-radius:8px;cursor:pointer;
        font-family:var(--sans);padding:14px 16px;margin-bottom:9px;font-size:14.5px;border:none}
  button.big{background:var(--primary);color:var(--primary-fg);font-weight:600}
  button.ghost{background:var(--surface);color:var(--fg);border:1px solid #2a3547;font-weight:600}
  button.big small,button.ghost small{display:block;font-weight:400;font-size:11.5px;
        margin-top:4px;opacity:.75}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chips button{background:var(--surface);border:1px solid #2a3547;color:var(--muted);
        border-radius:999px;padding:7px 13px;font:600 12px var(--sans);cursor:pointer}
  .chips button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);
        color:var(--primary-fg)}

  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{margin-bottom:6px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
       background:var(--surface);border:1px solid #2a3547;border-radius:8px;padding:12px 14px;
       cursor:pointer;text-align:left;color:var(--fg);font-family:var(--sans)}
  .row .nm{font-weight:600;font-size:14px}
  .row .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .row .pct{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;
         padding:9px 14px;border-bottom:1px solid #2a3547;font-size:11.5px;color:var(--muted)}
  .qhead .n{font-family:var(--serif);font-size:16px;color:var(--fg)}
  .passage{margin:0;padding:14px;font-size:14px;line-height:1.7;color:#cfd8e6;
           text-align:justify;border-bottom:1px dashed #2a3547}
  .stem{margin:0;padding:15px 14px 4px;font-family:var(--serif);font-size:17px;line-height:1.5;
        white-space:pre-line}
  .opts{list-style:none;margin:0;padding:4px 8px 12px}
  .opt{display:flex;align-items:flex-start;gap:11px;width:100%;background:none;border:none;
       border-top:1px solid rgba(135,152,173,.14);padding:11px 6px;cursor:pointer;
       text-align:left;color:var(--fg);font-family:var(--sans)}
  .opts li:first-child .opt{border-top:none}
  .bub{flex:0 0 auto;width:27px;height:27px;border-radius:50%;border:1.5px solid var(--muted);
       display:grid;place-items:center;font:600 12px var(--sans);color:var(--muted)}
  .opt .tx{font-size:14px;line-height:1.5;padding-top:3px}
  .opt[data-on] .bub{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .opt[data-st="right"] .bub{background:var(--ok);border-color:var(--ok);color:#08140e}
  .opt[data-st="wrong"] .bub{background:var(--bad);border-color:var(--bad);color:#2a0c06}
  .opt[data-st="key"] .bub{border-color:var(--ok);border-width:3px;color:var(--ok)}
  .opt[data-st="right"] .tx,.opt[data-st="key"] .tx{color:var(--ok)}
  .opt[data-st="wrong"] .tx{color:var(--bad)}

  .why{border-left:3px solid var(--primary);background:var(--raised);border-radius:0 8px 8px 0;
       padding:13px 14px;margin-top:14px}
  .why .t{font-weight:600;font-size:14px;margin:0 0 6px}
  .why p{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .why .saved{margin-top:8px;font-size:12px;color:var(--primary)}

  .bar{display:flex;gap:9px;margin-top:16px}
  .bar button{margin:0}
  .clock{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;
         background:var(--raised);border-radius:7px;padding:5px 11px}
  .clock.hot{background:rgba(224,116,95,.2);color:var(--bad)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .link{background:none;border:none;color:var(--muted);font:400 13.5px var(--sans);cursor:pointer;padding:0}

  .score{background:var(--surface);border:1px solid #2a3547;border-radius:9px;padding:20px;margin-bottom:18px}
  .score .lab{font:600 11.5px var(--sans);color:var(--primary);margin:0}
  .score .big{font-family:var(--serif);font-size:48px;line-height:1;margin:6px 0 4px;
              font-variant-numeric:tabular-nums}
  .score .of{font-size:13px;color:var(--muted);margin:0}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}
  .grid3 div{background:var(--raised);border-radius:7px;padding:11px 4px}
  .grid3 b{display:block;font-family:var(--serif);font-size:21px;font-weight:400}
  .grid3 span{font-size:11px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:18px}
  th,td{text-align:left;padding:9px 4px;border-bottom:1px solid #2a3547}
  th{font:600 11.5px var(--sans);color:var(--muted)}
  td.r,th.r{text-align:right}
  .empty{border:1px dashed #2a3547;border-radius:9px;padding:36px 18px;text-align:center;
         color:var(--muted);font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.6}
  .err{border:1px solid #2a3547;border-radius:8px;background:var(--surface);margin-bottom:9px}
  .err.pending{border-color:rgba(212,165,116,.45)}
  .err>button{width:100%;background:none;border:none;text-align:left;padding:13px 14px;
              cursor:pointer;color:var(--fg);font-family:var(--sans)}
  .err .qt{font-size:13.5px;line-height:1.5}
  .err .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
  .err .body{border-top:1px solid #2a3547;padding:13px 14px}
  .err .body .k{font:600 11.5px var(--sans);color:var(--primary);margin:0 0 4px}
  .err .body .k.ok{color:var(--ok)}
  .err .body p{margin:0 0 11px;font-size:13.5px;line-height:1.6;color:var(--muted)}
  .err .body p.fgtx{color:var(--fg)}
  textarea{width:100%;background:var(--raised);border:1px solid #2a3547;border-radius:7px;
           color:var(--fg);font:400 13.5px/1.6 var(--sans);padding:10px 11px;resize:vertical}
  .mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .mini button{flex:0 0 auto;width:auto;margin:0;padding:10px 15px;font-size:13px;border-radius:7px}
  .mini .okbtn{background:rgba(79,183,131,.14);border:1px solid rgba(79,183,131,.4);color:var(--ok)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
